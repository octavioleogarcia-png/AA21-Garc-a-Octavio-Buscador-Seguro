<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de productos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Buscador de productos</h1>
    <p class="subtitulo">Backend PHP + MySQL con PDO y consultas preparadas · Frontend con JavaScript Vanilla (fetch)</p>

    <section class="tarjeta">
        <h2>Agregar producto</h2>
        <form id="formulario-producto" novalidate>
            <label>Nombre
                <input type="text" id="nombre" name="nombre" maxlength="100">
                <span class="error" data-error="nombre"></span>
            </label>
            <label>Categoría
                <input type="text" id="categoria" name="categoria" maxlength="50">
                <span class="error" data-error="categoria"></span>
            </label>
            <label>Precio
                <input type="number" id="precio" name="precio" step="0.01" min="0">
                <span class="error" data-error="precio"></span>
            </label>
            <label>Stock
                <input type="number" id="stock" name="stock" step="1" min="0" value="0">
                <span class="error" data-error="stock"></span>
            </label>
            <div class="acciones">
                <button type="submit">Guardar producto</button>
            </div>
        </form>
    </section>

    <div id="mensaje" role="status"></div>

    <section class="tarjeta">
        <div class="cabecera-listado">
            <h2>Listado</h2>
            <input type="search" id="buscador" placeholder="Buscar por nombre o categoría...">
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th class="num">Precio</th>
                    <th class="num">Stock</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla"></tbody>
        </table>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
