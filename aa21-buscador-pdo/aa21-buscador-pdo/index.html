<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AA 21 - Buscador Seguro con PDO</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="search-box">
        <h2>Catálogo de Productos</h2>
        <p id="modo" class="modo"></p>

        <form id="form-buscar">
            <div class="form-group">
                <input
                    type="text"
                    id="input-buscar"
                    placeholder="Buscar por nombre o categoría..."
                    maxlength="100"
                >
                <button type="submit">Buscar</button>
            </div>
        </form>
    </div>

    <!-- Contenedor dinámico cargado mediante app.js -->
    <div id="resultados"></div>

    <div class="search-box">
        <h2>Agregar producto</h2>

        <form id="form-alta" novalidate>
            <div class="grid-alta">
                <label>Nombre
                    <input type="text" id="alta-nombre" name="nombre" maxlength="100">
                    <span class="error" data-error="nombre"></span>
                </label>
                <label>Categoría
                    <input type="text" id="alta-categoria" name="categoria" maxlength="50">
                    <span class="error" data-error="categoria"></span>
                </label>
                <label>Precio
                    <input type="number" id="alta-precio" name="precio" step="0.01" min="0">
                    <span class="error" data-error="precio"></span>
                </label>
                <label>Stock
                    <input type="number" id="alta-stock" name="stock" step="1" min="0" value="0">
                    <span class="error" data-error="stock"></span>
                </label>
            </div>
            <button type="submit">Guardar producto</button>
        </form>

        <p id="mensaje" role="status"></p>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
